[project]
name = "liveqna"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Raimondo Marino", email = "darkfenneer69@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.15.0",
    "ctranslate2>=4.8.2",
    "fastapi>=0.143.0",
    "faster-whisper>=1.2.1",
    "httpx>=0.28.1",
    "numpy>=2.5.3",
    "openai>=3.26.1",
    "pydantic>=2.14.0",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.19.1",
    "setuptools<81",
    "transformers>=5.19.0",
    "uvicorn[standard]>=0.54.0",
    "webrtcvad>=2.0.10",
    "websockets>=17.2",
]

[project.scripts]
liveqna = "liveqna:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
