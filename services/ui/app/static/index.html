<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>liveqna</title>
<style>
  :root {
    --bg: #0f1117; --panel: #171a23; --border: #2a2e3a;
    --text: #e6e8ef; --muted: #9aa0ad; --accent: #5b8def;
    --final: #e6e8ef; --partial: #7d8396;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg); color: var(--text); display: flex; height: 100vh;
  }
  #sidebar {
    width: 320px; min-width: 320px; background: var(--panel);
    border-right: 1px solid var(--border); padding: 16px; overflow-y: auto;
  }
  #main { flex: 1; display: flex; flex-direction: column; padding: 16px; }
  h1 { font-size: 16px; margin: 0 0 16px 0; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em;
       color: var(--muted); margin: 20px 0 8px 0; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
  select, input, button {
    width: 100%; padding: 7px 8px; background: #11131a; color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; font-size: 13px;
  }
  button { cursor: pointer; margin-top: 8px; transition: background .15s; }
  button:hover { background: #1c2030; }
  button.primary { background: var(--accent); color: #0a0a0a; border: none; font-weight: 600; }
  button.primary:hover { background: #74a0f3; }
  button.danger { border-color: #c0392b; color: #ff8577; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  #status { font-size: 12px; color: var(--muted); margin-top: 14px; line-height: 1.5; }
  #status .ok { color: #5cd68a; }
  #status .bad { color: #ff8577; }
  .field-group { display: none; }
  .field-group.active { display: block; }
  #transcript {
    flex: 1; overflow-y: auto; background: #11131a; border: 1px solid var(--border);
    border-radius: 8px; padding: 16px; font-size: 16px; line-height: 1.7;
  }
  .utterance-text { margin-bottom: 10px; }
  .utterance-text.final { color: var(--final); }
  .utterance-text.partial { color: var(--partial); font-style: italic; }
  #toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  #toolbar h1 { margin: 0; }
  #conn { font-size: 12px; }
  #conn.connected::before { content: "\25cf "; color: #5cd68a; }
  #conn.disconnected::before { content: "\25cf "; color: #ff8577; }
  #level-row { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  #level-dot {
    width: 10px; height: 10px; border-radius: 50%; background: #3a3f4e;
    transition: background .1s, box-shadow .1s;
  }
  #level-dot.live {
    background: #5cd68a; box-shadow: 0 0 8px 2px rgba(92, 214, 138, 0.6);
  }
  #level-bar-track {
    flex: 1; height: 8px; background: #11131a; border: 1px solid var(--border);
    border-radius: 4px; overflow: hidden;
  }
  #level-bar-fill {
    height: 100%; width: 0%; background: linear-gradient(90deg, #5cd68a, #e8c547, #e85d5d);
    transition: width .08s linear;
  }
  #level-label { font-size: 11px; color: var(--muted); width: 70px; text-align: right; }
</style>
</head>
<body>
  <div id="sidebar">
    <h1>liveqna &mdash; configuration</h1>


    <h2>Source</h2>
    <label for="source-select">Audio source</label>
    <select id="source-select"></select>
    <button id="refresh-sources">Refresh sources</button>

    <div class="row">
      <button id="start-btn" class="primary">Start</button>
      <button id="stop-btn" class="danger">Stop</button>
    </div>

    <h2>Capture params</h2>
    <label for="sample-rate">Sample rate (Hz)</label>
    <input id="sample-rate" type="number" value="16000" step="1000" />
    <label for="vad-aggr">VAD aggressiveness (0-3)</label>
    <input id="vad-aggr" type="number" min="0" max="3" value="2" />
    <label for="silence-ms">Silence timeout (ms)</label>
    <input id="silence-ms" type="number" step="50" value="700" />
    <label for="min-speech-ms">Min speech length (ms)</label>
    <input id="min-speech-ms" type="number" step="50" value="250" />
    <label for="max-segment-ms">Max segment length (ms)</label>
    <input id="max-segment-ms" type="number" step="500" value="12000" />


    <h2>Model</h2>
    <label for="backend-select">Backend</label>
    <select id="backend-select">
      <option value="local">Local (GPU)</option>
      <option value="openai">OpenAI</option>
      <option value="deepgram">Deepgram</option>
    </select>

    <div id="group-local" class="field-group">
      <label for="model-size">Model size</label>
      <select id="model-size">
        <option>tiny</option><option>base</option>
        <option selected>small</option><option>medium</option>
        <option>large-v3</option>
      </select>
      <label for="compute-type">Compute type</label>
      <select id="compute-type">
        <option selected>int8_float32</option>
        <option>int8</option><option>float16</option><option>float32</option>
      </select>
    </div>

    <div id="group-online" class="field-group">
      <label for="api-key">API key</label>
      <input id="api-key" type="password" placeholder="sk-..." />
      <label for="model-name">Model name</label>
      <input id="model-name" type="text" placeholder="(default)" />
    </div>

    <label for="language">Language</label>
    <input id="language" type="text" value="en" />

    <button id="apply-model" class="primary">Apply model config</button>

    <div id="status"></div>
  </div>

  <div id="main">
    <div id="toolbar">
      <h1>Live transcript</h1>
      <div style="display:flex; gap:8px; align-items:center;">
        <button id="clear-btn" style="margin-top:0; width:auto; padding:6px 14px;">Clear</button>
        <span id="conn" class="disconnected">disconnected</span>
      </div>
    </div>
    <div id="level-row">
      <div id="level-dot"></div>
      <div id="level-bar-track"><div id="level-bar-fill"></div></div>
      <div id="level-label">no signal</div>
    </div>
    <div id="transcript"></div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
